services:
  db:
    image: postgres:16-alpine
    container_name: fbolstats-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fbolstats
      POSTGRES_PASSWORD: fbolstats
      POSTGRES_DB: fbolstats
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fbolstats -d fbolstats"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
